<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Colour My Photo</title>
<meta name="description" content="Turn your photos into colouring pages and colour them in.">
<meta name="theme-color" content="#ff7a59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colour Me">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="home" class="screen active">
  <header class="hero">
    <h1>🖍️ Colour My Photo</h1>
    <p>Turn any photo into a colouring page, then colour it in.</p>
  </header>
  <div class="actions">
    <label class="big-btn primary">📷 Choose a photo<input id="file" type="file" accept="image/*" hidden></label>
    <button id="sample" class="big-btn">✨ Try a sample</button>
  </div>
  <h2 class="section-title">My pages</h2>
  <div id="gallery" class="gallery"></div>
  <p id="empty" class="empty">Your colouring pages will show up here.</p>
</section>

<section id="make" class="screen">
  <header class="bar">
    <button id="makeBack" class="icon-btn" aria-label="Back">←</button>
    <h2>Make your page</h2>
    <button id="printBlank" class="icon-btn" aria-label="Save blank page to print" title="Save blank page to print">🖨️</button>
  </header>
  <div class="preview-wrap">
    <canvas id="preview"></canvas>
    <div id="busy" class="busy"><span class="spinner"></span>Drawing lines…</div>
  </div>
  <div class="make-controls">
    <div class="slider-row">
      <span>Simple</span>
      <input id="detail" type="range" min="1" max="10" value="4" aria-label="Detail">
      <span>Detailed</span>
    </div>
    <button id="start" class="big-btn primary">Start colouring →</button>
  </div>
</section>

<section id="colour" class="screen">
  <header class="bar">
    <button id="colBack" class="icon-btn" aria-label="My pages">←</button>
    <div class="tools">
      <button class="tool active" data-tool="fill" aria-label="Fill">🪣</button>
      <button class="tool" data-tool="brush" aria-label="Brush">🖌️</button>
      <button class="tool" data-tool="eraser" aria-label="Eraser">🧽</button>
    </div>
    <div class="tools">
      <button id="undo" class="icon-btn" aria-label="Undo">↶</button>
      <button id="fit" class="icon-btn" aria-label="Fit to screen">⤢</button>
      <button id="share" class="icon-btn" aria-label="Save picture">💾</button>
    </div>
  </header>
  <div id="stage" class="stage">
    <div id="board" class="board">
      <canvas id="colourCv"></canvas>
      <canvas id="lineCv"></canvas>
    </div>
  </div>
  <footer class="palette-bar">
    <div id="palette" class="palette"></div>
    <div class="size-row">
      <label class="custom" aria-label="Pick any colour"><input id="custom" type="color" value="#ff7a59"><span id="current" class="current"></span></label>
      <span>Brush</span>
      <input id="size" type="range" min="3" max="80" value="20" aria-label="Brush size">
    </div>
  </footer>
</section>

<div id="saveView" class="overlay" hidden>
  <img id="saveImg" alt="Your picture">
  <p>Press and hold the picture, then tap <b>Save to Photos</b>.</p>
  <button id="saveClose" class="big-btn primary">Done</button>
</div>

<div id="toast" class="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
